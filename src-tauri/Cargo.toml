[package]
name = "srt-tool"
version = "0.1.0"
description = "A minimal lyric SRT timestamper"
edition = "2021"

[lib]
name = "srt_tool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
